# Render blueprint — API only.
#
# This pairs with the client deployed separately to Vercel (see vercel.json).
# The server does not build or serve the client here, so no devDependencies
# are needed and CORS must name the Vercel origin.
#
# To run the whole thing as ONE service on Render instead, use:
#   buildCommand: npm ci --include=dev && npm run build
# and drop CORS_ORIGIN — the server then serves the built client itself.
services:
  - type: web
    name: pathweaver-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_FORMAT
        value: json
      - key: DATA_FILE
        value: /var/data/store.json
      # The browser origin allowed to call this API. Set this to your Vercel
      # production domain once it exists; add preview domains comma-separated.
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: pathweaver-data
      mountPath: /var/data
      sizeGB: 1
