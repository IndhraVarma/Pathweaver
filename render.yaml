# Render blueprint: one web service that builds the client and serves it
# alongside the API from a single Node process. One origin, so there is no
# CORS to configure and no API URL to bake into the client.
services:
  - type: web
    name: pathweaver
    runtime: node
    plan: starter
    # --include=dev is required: NODE_ENV=production below would otherwise make
    # npm skip devDependencies, and Vite is one of them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_FORMAT
        value: json
      # Saved boards and run statistics live on the mounted disk below, so
      # they survive a redeploy.
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: pathweaver-data
      mountPath: /var/data
      sizeGB: 1
