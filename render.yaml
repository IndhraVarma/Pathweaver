# Render blueprint: one web service building the client and serving it
# alongside the API from a single Node process.
services:
  - type: web
    name: pathweaver
    runtime: node
    plan: starter
    # --include=dev is required: NODE_ENV=production below would otherwise make
    # npm skip devDependencies, and Vite is one of them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_FORMAT
        value: json
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: pathweaver-data
      mountPath: /var/data
      sizeGB: 1
